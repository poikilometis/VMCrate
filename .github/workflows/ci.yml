name: Windows validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build VMCrate.slnx -c Release
      - run: dotnet run --project tests/VMCrate.Tests -c Release --no-build
      - run: dotnet run --project src/VMCrate.Cli -c Release --no-build -- validate examples/two-node-lab.json
      - run: dotnet run --project src/VMCrate.Cli -c Release --no-build -- validate-recipes examples/recipes.json
      - run: powershell -NoProfile -NonInteractive -File tests/HyperV.Tests.ps1
      - name: Build release ZIP
        shell: pwsh
        run: ./scripts/New-Release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VMCrate-win-x64
          path: artifacts/releases/VMCrate-*.zip*
          if-no-files-found: error
          compression-level: 0
