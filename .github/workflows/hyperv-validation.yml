name: Dedicated Hyper-V validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    runs-on: [self-hosted, Windows, X64, vmcrate-hyperv]
    timeout-minutes: 90
    env:
      VMCRATE_TEST_FIXTURES: ${{ vars.VMCRATE_TEST_FIXTURES }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run acceptance against local fixtures
        shell: pwsh
        run: ./tests/Start-HyperVAcceptance.ps1 -Fixtures $env:VMCRATE_TEST_FIXTURES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hyperv-compatibility
          path: artifacts/hyperv-live/run-*/compatibility.json
          if-no-files-found: error
